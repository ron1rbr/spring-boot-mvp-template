spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            anable: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS} # comma-separeted list, e.g. https://app.example.com
  password-reset:
    reset-url-base: ${PASSWORD_RESET_URL_BASE}

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    com.example.template: WARN
    root: WARN
