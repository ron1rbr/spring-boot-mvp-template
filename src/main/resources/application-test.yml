app:
  cors:
    allowed-origins:
      - http://localhost:3000
  password-reset:
    reset-url-base: http://localhost:3000/reset-password
  rate-limit:
    # Counters live in memory and the Spring context is cached across test
    # classes, so limits would leak between tests (AuthControllerIntegrationTest
    # alone registers more than 5 users from the same address). Tests that
    # exercise rate limiting switch it back on explicitly.
    enabled: false

jwt:
  secret: test-secret-key-for-ci-pipeline-only-not-for-prod-x

logging:
  level:
    com.example.template: INFO
