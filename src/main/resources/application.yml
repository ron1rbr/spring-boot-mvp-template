spring:
  application:
    name: spring-boot-mvp-template
  profiles:
    active: dev

management:
  endpoints:
    web:
      exposure:
        # Allowlist, never "*". Adding an endpoint here is a deliberate act.
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true # /health/liveness and /health/readiness outside Kubernetes too
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false

app:
  password-reset:
    expiration-minutes: 30

jwt:
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  default-produces-media-type: application/json

server:
  port: 8080
