spring:
  application:
    name: spring-boot-mvp-template

management:
  endpoints:
    web:
      exposure:
        # Allowlist, never "*". Adding an endpoint here is a deliberate act.
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true # /health/liveness and /health/readiness outside Kubernetes too
      group:
        readiness:
          include: readinessState,db
  health:
    mail:
      enabled: false

app:
  password-reset:
    expiration-minutes: 30
  rate-limit:
    enabled: true
    max-tracked-clients: 10000
    rules:
      login:
        paths: [/api/auth/login]
        capacity: 10
        window: 1m
      register:
        paths: [/api/auth/register]
        capacity: 5
        window: 1h
      password-reset:
        paths: [/api/auth/password-reset/**]
        capacity: 5
        window: 1h
      session:
        paths: [/api/auth/refresh, /api/auth/logout]
        capacity: 30
        window: 1m

jwt:
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  default-produces-media-type: application/json

server:
  port: 8080
  # Resolve the real client IP from X-Forwarded-For, but only when the
  # connection comes from a trusted proxy (see README, "Behind a reverse proxy").
  forward-heades-strategy: native
