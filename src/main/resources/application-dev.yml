spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/template
    username: template
    password: template
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoint:
    health:
      show-details: always # handy locally; prod keeps the base value (never)

app:
  cors:
    allowed-origins:
      - http://localhost:5173 # adjust to your frontend's dev port (Vite default shown)
  password-reset:
    reset-url-base: http://localhost:5173/reset-password

jwt:
  secret: dev-only-secret-key-do-not-use-in-production-env

logging:
  level:
    com.example.template: DEBUG
    org.springframework.web: DEBUG
