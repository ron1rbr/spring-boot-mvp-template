spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/template
    username: template
    password: template
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.example.template: DEBUG
    org.springframework.web: DEBUG